[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vdfpy"
version = "0.1.1"
description = "Velocity distribution function classifier"
authors = [
  { name="Hongyang Zhou", email="hyzhou@umich.edu" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flekspy>=0.6.0",
    "pyvlasiator>=0.1.4",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "pyspedas>=1.7.1",
    "umap-learn>=0.5.7",
    "yt",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.2",
    "myst-nb>=1.0.0",
    "seaborn>=0.13.2",
    "sphinx-autoapi>=3.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
